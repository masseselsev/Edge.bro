# Host keys are read from a named volume rather than the image, so rebuilding
# borg-server does not change the server's fingerprint and invalidate the
# known_hosts entry every node holds. See docker/borg/entrypoint.sh.
HostKey /etc/ssh/keys/ssh_host_ed25519_key
HostKey /etc/ssh/keys/ssh_host_rsa_key
HostKey /etc/ssh/keys/ssh_host_ecdsa_key
