---
- name: Bootstrap Edge Node
  hosts: all
  become: yes
  gather_facts: no
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tasks:
    - name: Verify OS type and version compatibility
      raw: |
        if [ -f /etc/os-release ]; then
          . /etc/os-release
          OS_ID=$ID
          OS_VERSION_ID=$VERSION_ID
        else
          if [ -f /etc/debian_version ]; then
            OS_ID="debian"
            OS_VERSION_ID=$(cat /etc/debian_version | cut -d. -f1)
          else
            echo "OS_UNSUPPORTED: Could not determine operating system type."
            exit 1
          fi
        fi
        
        MAJOR_VERSION=$(echo "$OS_VERSION_ID" | cut -d. -f1 | tr -d '"')
        
        if ! echo "$MAJOR_VERSION" | grep -q '^[0-9]\+$'; then
          exit 0
        fi
        
        if [ "$OS_ID" = "debian" ]; then
          if [ "$MAJOR_VERSION" -lt 10 ]; then
            echo "OS_UNSUPPORTED: Debian version $OS_VERSION_ID is below Debian 10."
            exit 2
          fi
        elif [ "$OS_ID" = "ubuntu" ]; then
          if [ "$MAJOR_VERSION" -lt 18 ]; then
            echo "OS_UNSUPPORTED: Ubuntu version $OS_VERSION_ID is below Ubuntu 18."
            exit 2
          fi
        else
          if echo "$ID_LIKE" | grep -q "debian"; then
            echo "OS_UNSUPPORTED: Derivative OS $OS_ID ($OS_VERSION_ID) is not officially supported. Minimum requirement: Debian 10+ or Ubuntu 18+."
            exit 2
          else
            echo "OS_UNSUPPORTED: OS $OS_ID is not supported. Minimum requirement: Debian 10+ or Ubuntu 18+."
            exit 2
          fi
        fi
      changed_when: false

    - name: Ensure python3/pip are installed (with dynamic proxy test and temporary fallback)
      raw: |
        FORCE_ORCHESTRATOR="{% if force_orchestrator_proxy | default(false) | bool %}true{% else %}false{% endif %}"
        PROXY_RAW=$(apt-config dump | grep -i 'Acquire::http::Proxy ' | head -n1 | sed -E 's/.*http:\/\/([^"/]+).*/\1/')
        if [ "$FORCE_ORCHESTRATOR" != "true" ] && [ -n "$PROXY_RAW" ]; then
          PROXY_URL=$(echo "$PROXY_RAW" | sed -E 's/.*@//')
          PROXY_HOST=$(echo "$PROXY_URL" | cut -d: -f1)
          PROXY_PORT=$(echo "$PROXY_URL" | cut -d: -f2)
          if [ "$PROXY_PORT" = "$PROXY_HOST" ] || [ -z "$PROXY_PORT" ]; then
            PROXY_PORT=80
          fi
          if timeout 2 bash -c "cat < /dev/null > /dev/tcp/$PROXY_HOST/$PROXY_PORT" 2>/dev/null; then
            echo "Proxy $PROXY_HOST:$PROXY_PORT is reachable. Using proxy."
            apt-get update && apt-get install -y python3 python3-pip
            exit 0
          fi
        fi

        # Tier 2: Check direct internet access
        if [ "$FORCE_ORCHESTRATOR" != "true" ]; then
          if timeout 2 bash -c "cat < /dev/null > /dev/tcp/deb.debian.org/80" 2>/dev/null || \
             timeout 2 bash -c "cat < /dev/null > /dev/tcp/archive.ubuntu.com/80" 2>/dev/null; then
            echo "Direct internet connection is available. Disabling native proxy and running directly."
            if [ -n "$PROXY_RAW" ]; then
              for path in /etc/apt/apt.conf /etc/apt/apt.conf.d; do
                if [ -e "$path" ]; then
                  find "$path" -type f -exec grep -q "$PROXY_HOST" {} \; -print 2>/dev/null | while read -r f; do
                    mv "$f" "${f}.disabled"
                  done
                fi
              done
            fi
            apt-get update && apt-get install -y python3 python3-pip
            exit 0
          fi
        fi

        # Tier 3: Check orchestrator proxy
        # Detect incoming SSH connection IP
        DETECTED_SSH_IP=$(echo "$SSH_CONNECTION" | awk '{print $1}')
        if [ -z "$DETECTED_SSH_IP" ]; then
          DETECTED_SSH_IP=$(echo "$SSH_CLIENT" | awk '{print $1}')
        fi
        if [ -z "$DETECTED_SSH_IP" ]; then
          DETECTED_SSH_IP=$(who -m 2>/dev/null | awk '{print $NF}' | tr -d '()')
        fi

        IP_LIST=""
        if [ -n "{{ orchestrator_ip }}" ]; then
          IP_LIST="{{ orchestrator_ip }}"
        fi
        if [ -n "$DETECTED_SSH_IP" ] && [ "$DETECTED_SSH_IP" != "{{ orchestrator_ip }}" ]; then
          IP_LIST="$IP_LIST $DETECTED_SSH_IP"
        fi

        PROXY_SUCCESS=false
        for test_ip in $IP_LIST; do
          if timeout 2 bash -c "cat < /dev/null > /dev/tcp/$test_ip/3142" 2>/dev/null; then
            echo "Direct connection and native proxy failed. Using orchestrator APT proxy at $test_ip:3142."
            # Disable native proxy configurations temporarily
            if [ -n "$PROXY_RAW" ]; then
              for path in /etc/apt/apt.conf /etc/apt/apt.conf.d; do
                if [ -e "$path" ]; then
                  find "$path" -type f -exec grep -q "$PROXY_HOST" {} \; -print 2>/dev/null | while read -r f; do
                    mv "$f" "${f}.disabled"
                  done
                fi
              done
            fi
            echo "Acquire::http::Proxy \"http://$test_ip:3142\";" > /etc/apt/apt.conf.d/99orchestrator-proxy
            apt-get update && apt-get install -y python3 python3-pip
            PROXY_SUCCESS=true
            break
          fi
        done

        if [ "$PROXY_SUCCESS" = "true" ]; then
          exit 0
        fi

        echo "All access methods failed (native proxy, direct internet, and orchestrator proxy)."
        exit 3
      changed_when: false

    # The task above settles *how* to reach a mirror. This one settles whether
    # the mirror still carries this release at all -- a different failure with
    # the same symptom.
    #
    # Debian moves a release to archive.debian.org when its LTS window closes
    # and deletes it from deb.debian.org, so a node old enough hits 404 on
    # every suite no matter how good its connectivity is. Ubuntu does the same
    # with old-releases.ubuntu.com. Neither the APT proxy nor apt-cacher-ng
    # helps: a cache cannot serve what upstream no longer has.
    #
    # Two rules keep this from making things worse:
    #
    #   * It only runs after `apt-get update` has actually failed. A working
    #     mirror is never touched.
    #   * It only rewrites the canonical Debian/Ubuntu hostnames. A node
    #     pointed at a vendor or site-local mirror keeps it, because that name
    #     matches none of the patterns -- which matters, since a fleet's older
    #     machines usually do have their sources redirected already.
    #
    # If the archive does not help either, the originals go back so that the
    # failure reported below is the operator's own, not one we introduced.
    - name: Fall back to the archive mirror when a release has been retired
      raw: |
        APT_OPTS="-o Acquire::https::Verify-Peer=false -o Acquire::https::Verify-Host=false --allow-releaseinfo-change"

        if apt-get update $APT_OPTS >/tmp/edge-bro-apt.log 2>&1; then
          echo "APT_OK: configured mirrors answer for this release."
          exit 0
        fi

        . /etc/os-release 2>/dev/null || true
        echo "apt-get update failed; checking whether ${ID:-this OS} ${VERSION_CODENAME:-release} has been archived."

        LISTS="/etc/apt/sources.list"
        for f in /etc/apt/sources.list.d/*.list; do
          [ -e "$f" ] && LISTS="$LISTS $f"
        done

        case "${ID:-}" in
          debian|ubuntu) ;;
          *) echo "APT_FALLBACK_SKIPPED: ${ID:-unknown} is not Debian or Ubuntu; mirrors left alone."; exit 0 ;;
        esac

        # Backed up once only: a second run must not overwrite the operator's
        # original with our already-rewritten copy.
        for f in $LISTS; do
          [ -e "$f.edge-bro-orig" ] || cp -p "$f" "$f.edge-bro-orig"
        done

        if [ "${ID:-}" = "debian" ]; then
          for f in $LISTS; do
            sed -i \
              -e 's|https\?://deb\.debian\.org/debian-security|http://archive.debian.org/debian-security|g' \
              -e 's|https\?://security\.debian\.org/debian-security|http://archive.debian.org/debian-security|g' \
              -e 's|https\?://security\.debian\.org|http://archive.debian.org/debian-security|g' \
              -e 's|https\?://deb\.debian\.org/debian|http://archive.debian.org/debian|g' \
              -e 's|https\?://ftp\.[a-z0-9-]*\.\?debian\.org/debian|http://archive.debian.org/debian|g' \
              "$f"
          done
        else
          for f in $LISTS; do
            sed -i \
              -e 's|https\?://[a-z0-9.-]*archive\.ubuntu\.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' \
              -e 's|https\?://security\.ubuntu\.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' \
              "$f"
          done
        fi

        # An archived Release file is past its Valid-Until by design, and apt
        # treats that as fatal unless told otherwise.
        echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99edge-bro-archive

        if apt-get update $APT_OPTS >/tmp/edge-bro-apt2.log 2>&1; then
          echo "APT_FALLBACK_OK: switched to the archive mirror for ${VERSION_CODENAME:-this release}."
          exit 0
        fi

        for f in $LISTS; do
          [ -e "$f.edge-bro-orig" ] && mv "$f.edge-bro-orig" "$f"
        done
        rm -f /etc/apt/apt.conf.d/99edge-bro-archive
        echo "APT_FALLBACK_FAILED: the archive mirror did not help either; original sources restored."
        tail -5 /tmp/edge-bro-apt2.log
        exit 0
      changed_when: false

    - name: Install dependencies
      raw: apt-get update -o Acquire::https::Verify-Peer=false -o Acquire::https::Verify-Host=false --allow-releaseinfo-change || true; apt-get install -y -o Acquire::https::Verify-Peer=false -o Acquire::https::Verify-Host=false --allow-unauthenticated borgbackup parted udev dosfstools e2fsprogs util-linux

    - name: Create borg system user and generate SSH key
      raw: |
        if ! id -u borg >/dev/null 2>&1; then
          useradd -m -s /bin/bash borg
        fi
        mkdir -p /home/borg/.ssh
        chmod 700 /home/borg/.ssh
        chown borg:borg /home/borg/.ssh
        # The borg user only ever talks to the orchestrator, so this file holds
        # at most one entry. Dropping it here is safe and cheap even when
        # nothing changed — the next connection just relearns the same key —
        # but it means a node whose known_hosts predates an orchestrator
        # migration (or came from a base image with a stale entry baked in)
        # stops printing "REMOTE HOST IDENTIFICATION HAS CHANGED" on every
        # single backup afterwards.
        rm -f /home/borg/.ssh/known_hosts /root/.ssh/known_hosts /etc/ssh/ssh_known_hosts 2>/dev/null || true
        ORCH_IP='{{ orchestrator_ip }}'
        if [ -n "$ORCH_IP" ]; then
          (ssh-keyscan -t ed25519 -p 12345 "$ORCH_IP" 2>/dev/null; ssh-keyscan -t ed25519 "$ORCH_IP" 2>/dev/null) > /home/borg/.ssh/known_hosts || true
          chown borg:borg /home/borg/.ssh/known_hosts 2>/dev/null || true
          chmod 644 /home/borg/.ssh/known_hosts 2>/dev/null || true
        fi
        if [ ! -f /home/borg/.ssh/id_ed25519 ]; then
          ssh-keygen -t ed25519 -N '' -f /home/borg/.ssh/id_ed25519
          chown borg:borg /home/borg/.ssh/id_ed25519*
          chmod 600 /home/borg/.ssh/id_ed25519
          chmod 644 /home/borg/.ssh/id_ed25519.pub
        fi

    - name: Read generated public key
      raw: cat /home/borg/.ssh/id_ed25519.pub
      register: pubkey

    - name: Return public key to orchestrator
      debug:
        msg: "SSH_KEY: {{ pubkey.stdout | trim }}"

    - name: Authorize orchestrator SSH public key on edge node
      raw: |
        PUBKEY='{{ orchestrator_ssh_pub_key }}'
        TAG='edge-bro-orchestrator'
        AUTH=/root/.ssh/authorized_keys
        KEYTYPE=$(echo "$PUBKEY" | awk '{print $1}')
        BLOB=$(echo "$PUBKEY" | awk '{print $2}')
        mkdir -p /root/.ssh
        chmod 700 /root/.ssh
        touch "$AUTH"
        cp "$AUTH" "$AUTH.bak.$(date +%s)" 2>/dev/null || true
        if awk -v blob="$BLOB" -v tag="$TAG" '
             { n = split($0, f, /[ \t]+/)
               hasblob = 0
               for (i = 1; i <= n; i++) if (f[i] == blob) hasblob = 1
               if (n >= 2 && f[n] == tag) {
                 if (!hasblob) print "EDGEBRO: removed stale orchestrator key " f[2] > "/dev/stderr"
                 next
               }
               if (hasblob && f[1] ~ /^(ssh-|ecdsa-|sk-)/) {
                 print "EDGEBRO: re-tagging existing key" > "/dev/stderr"
                 next
               }
               print $0
             }
           ' "$AUTH" > "$AUTH.new" 2>/tmp/edgebro_ak.log; then
          mv "$AUTH.new" "$AUTH"
        else
          rm -f "$AUTH.new"
          echo "EDGEBRO: could not parse authorized_keys; leaving it untouched"
        fi
        echo "$KEYTYPE $BLOB $TAG" >> "$AUTH"
        chmod 600 "$AUTH"
        cat /tmp/edgebro_ak.log 2>/dev/null
        rm -f /tmp/edgebro_ak.log
        echo "EDGEBRO: authorized orchestrator key $TAG"
        awk 'NF && substr($1,1,1) != "#" { print "NODE_AUTHKEY: " $0 }' "$AUTH"
      when: orchestrator_ssh_pub_key is defined and orchestrator_ssh_pub_key | length > 0

    - name: Configure SSH to allow root login with keys
      raw: |
        sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin prohibit-password/' /etc/ssh/sshd_config
        systemctl restart sshd || systemctl restart ssh || service ssh restart || service sshd restart

    - name: Gather partition and system details
      raw: |
        set -e
        root_part=$(findmnt -n -o SOURCE / || echo "")
        root_disk=$(lsblk -no PKNAME "$root_part" 2>/dev/null || echo "")
        if [ -z "$root_disk" ] && [ -n "$root_part" ]; then
          root_disk=$(echo "$root_part" | sed -E 's/p[0-9]+$//')
        fi
        disk_base=$(basename "$root_disk")
        
        disk_size=""
        disk_model=""
        if [ -n "$root_disk" ]; then
          disk_size=$(lsblk -d -no SIZE "/dev/$disk_base" 2>/dev/null | xargs || echo "")
          disk_model=$(lsblk -d -no MODEL "/dev/$disk_base" 2>/dev/null | xargs || echo "")
        fi

        disk_type_str="SATA"
        if echo "$disk_base" | grep -q "nvme"; then
          disk_type_str="NVME"
        fi

        if [ -n "$disk_size" ]; then
          if [ -n "$disk_model" ]; then
            disk_type="$disk_type_str $disk_size ($disk_model)"
          else
            disk_type="$disk_type_str $disk_size"
          fi
        else
          disk_type="$disk_type_str"
        fi

        net_iface=$(ip -o route get 8.8.8.8 2>/dev/null | awk '{print $5}' || echo "")

        efi_part=$(findmnt -n -o SOURCE /boot/efi || findmnt -n -o SOURCE /boot || echo "")
        efi_uuid=""
        if [ -n "$efi_part" ]; then
          efi_uuid=$(blkid -s UUID -o value "$efi_part" || echo "")
        fi

        part_boot=$(findmnt -n -o SOURCE /boot || echo "")
        part_log=$(findmnt -n -o SOURCE /var/log/edge || echo "")
        part_stor=$(findmnt -n -o SOURCE /var/opt/edge || echo "")

        label_root=$(e2label "$root_part" 2>/dev/null || echo "")
        label_boot=$(e2label "$part_boot" 2>/dev/null || echo "")
        label_log=$(e2label "$part_log" 2>/dev/null || echo "")
        label_stor=$(e2label "$part_stor" 2>/dev/null || echo "")

        fstab_labels_ok="false"
        if grep -q "LABEL=edgeroot" /etc/fstab && grep -q "LABEL=edgeboot" /etc/fstab && grep -q "LABEL=edgelog" /etc/fstab && grep -q "LABEL=edgestor" /etc/fstab; then
          fstab_labels_ok="true"
        fi

        prepared="false"
        if [ "$label_root" = "edgeroot" ] && [ "$label_boot" = "edgeboot" ] && [ "$label_log" = "edgelog" ] && [ "$label_stor" = "edgestor" ] && [ "$fstab_labels_ok" = "true" ]; then
          prepared="true"
        fi

        os_name="Unknown"
        if [ -f /etc/os-release ]; then
          . /etc/os-release
          os_name="$NAME $VERSION_ID"
        elif [ -f /etc/debian_version ]; then
          os_name="Debian $(cat /etc/debian_version)"
        fi

        # Read CPU details
        cpu_info=$(lscpu | grep -m1 'Model name' | cut -d: -f2- | xargs || true)
        if [ -z "$cpu_info" ]; then
          cpu_info=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs || echo "Generic CPU")
        fi

        # Read Memory details (RAM)
        mem_info=$(free -h | awk '/^Mem:/ {print $2}' || echo "Unknown RAM")

        # Get detailed RAM info using dmidecode
        ram_details=""
        if command -v dmidecode >/dev/null 2>&1; then
          ram_sizes=$(dmidecode -t 17 2>/dev/null | grep -E '^[[:space:]]*Size:' | grep -iv "No Board" | grep -v "No Device" | grep -E "[0-9]" || echo "")
          ram_count=$(echo "$ram_sizes" | wc -l)
          if [ "$ram_count" -gt 0 ] && [ -n "$ram_sizes" ]; then
            ram_type=$(dmidecode -t 17 2>/dev/null | grep -A10 "Memory Device" | grep -m1 "Type:" | cut -d: -f2 | xargs || echo "")
            ram_speed=$(dmidecode -t 17 2>/dev/null | grep -A15 "Memory Device" | grep -m1 "Speed:" | cut -d: -f2 | xargs || echo "")
            ram_size_first=$(echo "$ram_sizes" | head -n1 | cut -d: -f2 | xargs || echo "")
            if [ -z "$ram_speed" ] || [ "$ram_speed" = "Unknown" ]; then
              ram_speed=$(dmidecode -t 17 2>/dev/null | grep -A15 "Memory Device" | grep -m1 "Configured Clock Speed:" | cut -d: -f2 | xargs || echo "")
            fi
            ram_details="${ram_count}x ${ram_size_first}"
            if [ -n "$ram_type" ] && [ "$ram_type" != "Unknown" ]; then
              ram_details="${ram_details} ${ram_type}"
            fi
            if [ -n "$ram_speed" ] && [ "$ram_speed" != "Unknown" ] && [ "$ram_speed" != "Configured Clock Speed" ]; then
              ram_details="${ram_details} @ ${ram_speed}"
            fi
          fi
        fi

        if [ -n "$ram_details" ]; then
          mem_info="$mem_info ($ram_details)"
        fi

        # Read EDGE Version from MOTD / dynamic scripts / config files
        edge_ver="UNKNOWN"
        # 1. Try static MOTD files
        for f in /etc/motd /run/motd.dynamic /var/run/motd /etc/motd.d/*; do
          if [ -r "$f" ]; then
            val=$(grep -A1 -i "^EDGE:" "$f" 2>/dev/null | tail -n1 | xargs || echo "")
            if [ -n "$val" ] && [ "$val" != "EDGE:" ] && [ "$val" != "edge:" ] && [ "$val" != "EDGE" ]; then
              edge_ver="$val"
              break
            fi
          fi
        done
        # 2. Try dynamic MOTD scripts
        if [ "$edge_ver" = "UNKNOWN" ]; then
          for f in /etc/update-motd.d/*; do
            if [ -x "$f" ]; then
              val=$("$f" 2>/dev/null | grep -A1 -i "^EDGE:" | tail -n1 | xargs || echo "")
              if [ -n "$val" ] && [ "$val" != "EDGE:" ] && [ "$val" != "edge:" ]; then
                edge_ver="$val"
                break
              fi
            fi
          done
        fi
        # 3. Try version file path fallbacks
        if [ "$edge_ver" = "UNKNOWN" ]; then
          for f in /etc/edge-version /etc/edge_version /etc/edge/version; do
            if [ -r "$f" ]; then
              val=$(cat "$f" | xargs || echo "")
              if [ -n "$val" ]; then
                edge_ver="$val"
                break
              fi
            fi
          done
        fi

        # Gather HASP Runtime Package Version
        hasp_ver="None"
        if dpkg-query -W -f='${Version}' edge-hasp-eoawt3 >/dev/null 2>&1; then
          hasp_ver=$(dpkg-query -W -f='${Version}' edge-hasp-eoawt3 2>/dev/null || echo "None")
        fi

        echo "DISK_TYPE:$disk_type"
        echo "EFI_UUID:$efi_uuid"
        echo "INTERFACE:$net_iface"
        echo "PREPARED:$prepared"
        echo "HOSTNAME:$(hostname)"
        echo "OS_VERSION:$os_name"
        echo "CPU_INFO:$cpu_info"
        echo "MEM_INFO:$mem_info"
        echo "EDGE_VERSION:$edge_ver"
        echo "HASP_VERSION:$hasp_ver"
        echo "PARTITION_LAYOUT_JSON:$(lsblk -J -b -o NAME,TYPE,FSTYPE,SIZE,MOUNTPOINT,LABEL,UUID,PARTUUID 2>/dev/null | tr -d '\n')"
      register: sys_info
      changed_when: false

    - name: Return system info to orchestrator
      debug:
        msg: "{{ sys_info.stdout_lines }}"

    - name: Restore proxy configurations and clean up orchestrator proxy
      raw: |
        rm -f /etc/apt/apt.conf.d/99orchestrator-proxy
        for path in /etc/apt/apt.conf /etc/apt/apt.conf.d; do
          if [ -e "$path" ]; then
            find "$path" -type f -name "*.disabled*" 2>/dev/null | while read -r f; do
              new_name=$(echo "$f" | sed -E 's/(\.disabled)+$//')
              if [ "$f" != "$new_name" ]; then
                mv "$f" "$new_name"
              fi
            done
          fi
        done
      changed_when: false
      failed_when: false
