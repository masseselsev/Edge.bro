---
# Removes the orchestrator's own SSH key from a node being decommissioned.
#
# Run when a node is deleted, and best-effort by design: a box being retired is
# usually already switched off, so an unreachable host is a logged outcome
# rather than a failure. See tasks/bootstrap.revoke_node_access_task.
#
# Three properties matter more than they look:
#
# * **`raw` rather than the `authorized_key` module.** This runs against a node
#   that may have nothing installed on it — no Python, therefore no Ansible
#   modules. `raw` is the only thing guaranteed to work on a host that is on
#   its way out.
# * **Only our own key is touched.** Entries are matched on this
#   orchestrator's own tag (core.ssh_keys.orchestrator_tag), passed in as
#   `orchestrator_tag`, not a blanket `edge-bro-*` prefix — a node can be
#   enrolled with more than one orchestrator, and decommissioning it from one
#   must never remove another orchestrator's still-live grant. A node's
#   authorized_keys otherwise belongs to the customer; removing an entry we
#   did not add would lock someone out of a machine we are in the middle of
#   walking away from.
#
#   Also matches the fixed, pre-per-orchestrator-tagging `edge-bro-orchestrator`
#   tag every install used to write before bootstrap.yml started tagging per
#   install (core.ssh_keys.ORCHESTRATOR_TAG). This is still safe to remove
#   unconditionally: multi-orchestrator support did not exist before that
#   change, so a node carrying that legacy tag was bootstrapped by exactly
#   one orchestrator, which can only be the one now decommissioning it — a
#   node re-bootstrapped since then already carries the new per-install tag
#   instead. Without this fallback, deleting a node that was never
#   re-bootstrapped after the upgrade would silently leave its key behind:
#   `orchestrator_tag` would look for a tag the node's authorized_keys does
#   not have, find nothing to remove, and still report REVOKE_RESULT: ok.
# * **The file is never left half-written.** awk writes to a temporary file and
#   the move only happens if awk exited cleanly. The alternative — editing in
#   place — turns a parse error into a machine nobody can log into.
#
# A timestamped backup is kept beside the file regardless, because this is the
# last thing the orchestrator ever does to that host.
- name: Revoke orchestrator SSH access from a decommissioned node
  hosts: all
  gather_facts: no
  become: no
  tasks:
    - name: Remove edge-bro tagged keys from the node authorized_keys
      raw: |
        AUTH=/root/.ssh/authorized_keys
        if [ ! -f "$AUTH" ]; then
          echo "REVOKE_RESULT: no authorized_keys file"
          exit 0
        fi
        cp "$AUTH" "$AUTH.bak.$(date +%s)" 2>/dev/null || true
        TAG='{{ orchestrator_tag }}'
        # The fixed tag every install wrote before per-orchestrator tagging
        # existed — see the note above on why matching it unconditionally is
        # still safe.
        LEGACY_TAG='edge-bro-orchestrator'
        # Fields are split on whitespace; the tag is the last one, which is
        # where orchestrator_tag() puts it. Exact match only — a prefix match
        # here would also remove every other orchestrator enrolled on this
        # node. Removed keys are reported on stderr so they end up in the
        # task log without polluting the file being rewritten on stdout.
        if awk -v tag="$TAG" -v legacy_tag="$LEGACY_TAG" '
             { n = split($0, f, /[ \t]+/)
               if (n >= 2 && (f[n] == tag || f[n] == legacy_tag)) {
                 print "REVOKE_REMOVED: " f[n] > "/dev/stderr"
                 next
               }
               print $0
             }
           ' "$AUTH" > "$AUTH.new" 2>/tmp/edgebro_revoke.log; then
          mv "$AUTH.new" "$AUTH"
          chmod 600 "$AUTH"
          cat /tmp/edgebro_revoke.log 2>/dev/null
          rm -f /tmp/edgebro_revoke.log
          echo "REVOKE_RESULT: ok"
        else
          rm -f "$AUTH.new"
          echo "REVOKE_RESULT: parse failed, file left untouched"
        fi
      # Nothing here is idempotent to report on — the node is being deleted and
      # the run either reached it or did not.
      changed_when: false
