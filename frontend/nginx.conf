# Upgrade/Connection are hop-by-hop headers, so nginx drops them unless they
# are forwarded explicitly — without this a WebSocket handshake arrives at the
# backend as an ordinary request and the browser sees the connection fail. The
# map keeps normal HTTP requests on "close" rather than claiming an upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 7777;
    server_name localhost;

    resolver 127.0.0.11 valid=5s;

    # Shared by every proxied location below, and deliberately declared here
    # rather than inside them: nginx only inherits proxy_set_header when the
    # inner block declares none of its own, so adding one header inside a
    # location silently drops all of these.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
    }

    # The web terminal holds a WebSocket open with no traffic at all while an
    # operator reads the screen. The backend closes an idle session itself at
    # 15 minutes, so nginx has to outlast that instead of cutting the session
    # off at its own 60s default and making the app's timeout unreachable.
    location ~ ^/api/nodes/[0-9]+/terminal$ {
        set $backend_service backend:8000;
        proxy_pass http://$backend_service;
        proxy_read_timeout 950s;
        proxy_send_timeout 950s;
    }

    location /api/ {
        set $backend_service backend:8000;
        proxy_pass http://$backend_service;
    }
}
